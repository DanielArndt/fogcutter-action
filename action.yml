name: "Fogcutter - External Blocker Monitor"
description: "Periodically check if external blockers (GitHub issues/PRs, Snapcraft releases, GitHub releases, HTTP/JSON, commands, upstream dependency versions) are resolved and trigger follow-up actions."
author: "Dan Arndt"

inputs:
  config:
    description: "Path to blockers YAML configuration file"
    required: false
    default: ".github/blockers.yaml"
  scan:
    description: "Comma-separated paths to scan for inline BLOCKER(...) or TODO(blocked-by:...) annotations"
    required: false
    default: ""
  scan_issues:
    description: "Scan open GitHub issues in target repository for blocker annotations (true/false)"
    required: false
    default: "false"
  repo:
    description: "Target GitHub repository (owner/name) for follow-up actions; defaults to $GITHUB_REPOSITORY"
    required: false
    default: ""
  state_file:
    description: "Optional path to a JSON file to persist triggered blocker IDs"
    required: false
    default: ""
  dry_run:
    description: "Evaluate blockers and preview follow-up actions without executing side effects (true/false)"
    required: false
    default: "false"
  fail_on_resolved:
    description: "Exit with non-zero status if any blocker is resolved (true/false)"
    required: false
    default: "false"
  version:
    description: "fogcutter release to run, with or without a leading v (e.g. 0.1.0), or 'latest'. Defaults to the version this action release was tested with."
    required: false
    default: "0.1.0"
  github_token:
    description: "GitHub token for checking issues/releases and triggering follow-up actions"
    required: false
    default: ${{ github.token }}

outputs:
  total_blockers:
    description: "Total number of blockers evaluated"
    value: ${{ steps.run_fogcutter.outputs.total_blockers }}
  resolved_count:
    description: "Number of blockers that are resolved"
    value: ${{ steps.run_fogcutter.outputs.resolved_count }}
  has_resolved:
    description: "Whether at least one blocker is resolved (true/false)"
    value: ${{ steps.run_fogcutter.outputs.has_resolved }}
  resolved_json:
    description: "JSON array of resolved blocker results"
    value: ${{ steps.run_fogcutter.outputs.resolved_json }}

runs:
  using: "composite"
  steps:
    - name: Install fogcutter
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        REPO="DanielArndt/fogcutter"

        case "${RUNNER_OS}" in
          Linux)   os=linux;   ext=tar.gz ;;
          macOS)   os=darwin;  ext=tar.gz ;;
          Windows) os=windows; ext=zip ;;
          *) echo "::error::Unsupported runner OS: ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported runner architecture: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        version="${INPUT_VERSION#v}"
        if [[ "${version}" == "latest" ]]; then
          tag="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)"
          if [[ -z "${tag}" ]]; then
            echo "::error::Could not resolve the latest fogcutter release"
            exit 1
          fi
        else
          tag="v${version}"
        fi

        archive="fogcutter_${tag}_${os}_${arch}.${ext}"
        base="https://github.com/${REPO}/releases/download/${tag}"
        dest="${RUNNER_TEMP}/fogcutter-${tag}"
        mkdir -p "${dest}"

        echo "Downloading ${archive}"
        curl -fsSL -o "${dest}/${archive}" "${base}/${archive}"
        curl -fsSL -o "${dest}/checksums.txt" "${base}/checksums.txt"

        echo "Verifying checksum"
        expected="$(awk -v f="${archive}" '$2 == f {print $1}' "${dest}/checksums.txt")"
        if [[ -z "${expected}" ]]; then
          echo "::error::${archive} not found in checksums.txt"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${dest}/${archive}" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "${dest}/${archive}" | awk '{print $1}')"
        fi
        if [[ "${actual}" != "${expected}" ]]; then
          echo "::error::Checksum mismatch for ${archive} (expected ${expected}, got ${actual})"
          exit 1
        fi

        if [[ "${ext}" == "zip" ]]; then
          unzip -q -o "${dest}/${archive}" -d "${dest}"
          bin="${dest}/fogcutter_${tag}_${os}_${arch}/fogcutter.exe"
        else
          tar -xzf "${dest}/${archive}" -C "${dest}"
          bin="${dest}/fogcutter_${tag}_${os}_${arch}/fogcutter"
        fi
        echo "bin=${bin}" >> "${GITHUB_OUTPUT}"
        "${bin}" version

    - name: Run fogcutter
      id: run_fogcutter
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        FOGCUTTER_BIN: ${{ steps.install.outputs.bin }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_SCAN_ISSUES: ${{ inputs.scan_issues }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_STATE_FILE: ${{ inputs.state_file }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_FAIL_ON_RESOLVED: ${{ inputs.fail_on_resolved }}
      run: |
        set -euo pipefail

        ARGS=("check" "-config" "${INPUT_CONFIG}")
        if [[ -n "${INPUT_SCAN}" ]]; then
          ARGS+=("-scan" "${INPUT_SCAN}")
        fi
        if [[ "${INPUT_SCAN_ISSUES}" == "true" ]]; then
          ARGS+=("-scan-issues")
        fi
        if [[ -n "${INPUT_REPO}" ]]; then
          ARGS+=("-repo" "${INPUT_REPO}")
        fi
        if [[ -n "${INPUT_STATE_FILE}" ]]; then
          ARGS+=("-state-file" "${INPUT_STATE_FILE}")
        fi
        if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
          ARGS+=("-dry-run")
        fi
        if [[ "${INPUT_FAIL_ON_RESOLVED}" == "true" ]]; then
          ARGS+=("-fail-on-resolved")
        fi

        "${FOGCUTTER_BIN}" "${ARGS[@]}"
